; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
board_build.filesystem = littlefs
lib_deps =
	AsyncTCP
	https://github.com/me-no-dev/ESPAsyncWebServer
	ArduinoOTA
	adafruit/Adafruit BMP280 Library@^2.6.8
	luisllamasbinaburo/I2CScanner@^1.0.1
	asukiaaa/MPU9250_asukiaaa@^1.5.13
	sparkfun/SparkFun LSM6DS3 Breakout@^1.0.3
	bblanchon/ArduinoJson@^7.2.0
	knolleary/PubSubClient@^2.8
board_build.partitions = default.csv

[env:ota]
extends = env:lolin_s2_mini
upload_protocol = espota
upload_port = 192.168.0.108

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>

[env:native_coverage]
extends = env:native
build_flags = -fprofile-instr-generate -fcoverage-mapping
extra_scripts = pre:coverage_flags.py
